<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel = "stylesheet" href="Exercise4.css">
</head>
<body>
    <nav>
        <span>Clock</span>
        <button class="theme">Change Theme</button>
    </nav>
    <main>
        <div class="container">
            <div class="time">
                <div class="hour-minute"><span class="hour">00</span>:<span class="min">00</span></div>
                <div class="timming">
                    <div class="time-box Ampm">AM</div>
                    <div class="second time-box">00</div>
                </div>
            </div>
            <div class="datebox">
                <span class="day">Monday</span>-
                <span class="month">January</span>
                <span class="Date">20</span>
            </div>
        </div>
    </main>
</body>
<script src="Exercise4.js"></script>
</html>
