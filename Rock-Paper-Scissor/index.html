<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>Rock Paper Scissor</h1>
    </nav>
    <div id="container">
        <div class="images">
            <div class="image rock">
                <img src="Rock.jpg">
                <h1 class="image-title">Rock</h1>
            </div>
            <div class="image paper">
                <img src="Paper.jpg">
                <h1 class="image-title">Paper</h1>
            </div>
            <div class="image Scissor">
                <img src="Scissor.jpg">
                <h1 class="image-title">Scissor</h1>
            </div>
        </div>
        <div class="Count-box">
            <div class="count">
                <h1 class="human-count">0</h1>
                <h1 class="person">You</h1>
            </div>
            <div class="count">
                <h1 class="bot-count">0</h1>
                <h1 class="person">AI</h1>
            </div>
        </div>
        <div class="winner-declare">
            <div class="winner">Pick Your Move</div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
